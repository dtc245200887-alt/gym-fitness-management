x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    container_name: gym_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gym_edge
    logging: *default-logging

  app:
    build: .
    container_name: gym_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: gym_db
      DB_USER: gym_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gym_edge
      - gym_data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  db:
    image: mysql:8.0
    container_name: gym_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: gym_db
      MYSQL_USER: gym_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gym_data
    logging: *default-logging

  phpmyadmin:
    image: phpmyadmin:5.2.2
    container_name: gym_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gym_data
      - gym_admin
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  mysql-exporter-init:
    image: mysql:8.0
    container_name: gym_mysql_exporter_init
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        password_hex=$$(printf '%s' "$$EXPORTER_PASSWORD" | od -An -tx1 | tr -d ' \n')
        mysql -h db -uroot -p"$$MYSQL_ROOT_PASSWORD" <<SQL
        SET @exporter_password = CONVERT(UNHEX('$$password_hex') USING utf8mb4);
        SET @create_user = CONCAT('CREATE USER IF NOT EXISTS ''exporter''@''%'' IDENTIFIED BY ', QUOTE(@exporter_password));
        PREPARE exporter_statement FROM @create_user;
        EXECUTE exporter_statement;
        DEALLOCATE PREPARE exporter_statement;
        SET @alter_user = CONCAT('ALTER USER ''exporter''@''%'' IDENTIFIED BY ', QUOTE(@exporter_password));
        PREPARE exporter_statement FROM @alter_user;
        EXECUTE exporter_statement;
        DEALLOCATE PREPARE exporter_statement;
        GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* TO 'exporter'@'%';
        SQL
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      EXPORTER_PASSWORD: ${EXPORTER_PASSWORD:?Set EXPORTER_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gym_data
    restart: "no"
    logging: *default-logging

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: gym_mysql_exporter
    restart: unless-stopped
    command:
      - --config.my-cnf=/etc/.my.cnf
    configs:
      - source: mysql-exporter-client
        target: /etc/.my.cnf
        mode: 0444
    depends_on:
      mysql-exporter-init:
        condition: service_completed_successfully
    networks:
      - gym_data
      - gym_monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: gym_nginx_exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/nginx_status
    depends_on:
      - nginx
    networks:
      - gym_edge
      - gym_monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: gym_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - gym_monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: gym_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - cadvisor
      - nginx-exporter
      - mysqld-exporter
    networks:
      - gym_monitoring
      - gym_admin
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  loki:
    image: grafana/loki:3.5.0
    container_name: gym_loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - gym_monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.5.0
    container_name: gym_promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/var/lib/promtail
    depends_on:
      - loki
    networks:
      - gym_monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.1.0
    container_name: gym_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - gym_monitoring
      - gym_admin
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

configs:
  mysql-exporter-client:
    content: |
      [client]
      user=exporter
      password=${EXPORTER_PASSWORD:?Set EXPORTER_PASSWORD in .env}
      host=db

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:

networks:
  gym_edge:
    driver: bridge
  gym_data:
    driver: bridge
    internal: true
  gym_admin:
    driver: bridge
  gym_monitoring:
    driver: bridge
    internal: true
